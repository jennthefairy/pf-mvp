<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse AI</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="/styles/pagefairy-theme.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=DM+Sans:wght@400;700&family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">
        
</head>
<div class="max-w-2xl w-full bg-white rounded-lg shadow-xl p-8 item-center justify-center mx-auto my-16">
   <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Create Your Brand Profile</h2>
   <p class="text-center text-gray-500 mb-8">Let's set up your brand's identity to use across your campaigns.</p>
   <form class="space-y-6">
      <div>
         <label class="block text-sm font-medium text-gray-700 mb-2">Upload Your Logo</label>
         <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
            <div class="space-y-1 text-center">
               <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                  <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
               </svg>
               <div class="flex text-sm text-gray-600">
                  <label for="logo-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-brand-primary hover:text-brand-dark focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-brand-primary"><span>Upload a file</span><input id="logo-upload" class="sr-only" accept="image/*" type="file" name="logo-upload"></label>
                  <p class="pl-1">or drag and drop</p>
               </div>
               <p class="text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
            </div>
         </div>
      </div>
      <div class="bg-gray-50 p-4 rounded-lg">
         <h3 class="font-semibold text-gray-800 mb-2">✨ AI Branding Assistant</h3>
         <p class="text-sm text-gray-600 mb-3">Upload a moodboard or inspiration image, and our AI will suggest a color palette and font style for you.</p>
         <div class="flex items-center space-x-4">
            <input id="moodboard-upload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-secondary file:text-brand-primary hover:file:bg-brand-light" type="file">
            <button type="button" disabled="" class="flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-primary hover:bg-brand-dark disabled:bg-gray-300">
               <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon" class="h-5 w-5 mr-2">
                  <path fill-rule="evenodd" d="M9 4.5a.75.75 0 0 1 .721.544l.813 2.846a3.75 3.75 0 0 0 2.576 2.576l2.846.813a.75.75 0 0 1 0 1.442l-2.846.813a3.75 3.75 0 0 0-2.576 2.576l-.813 2.846a.75.75 0 0 1-1.442 0l-.813-2.846a3.75 3.75 0 0 0-2.576-2.576l-2.846-.813a.75.75 0 0 1 0-1.442l2.846-.813A3.75 3.75 0 0 0 7.466 7.89l.813-2.846A.75.75 0 0 1 9 4.5ZM18 1.5a.75.75 0 0 1 .728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 0 1 0 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 0 1-1.456 0l-.258-1.036a2.625 2.625 0 0 0-1.91-1.91l-1.036-.258a.75.75 0 0 1 0-1.456l1.036-.258a2.625 2.625 0 0 0 1.91-1.91l.258-1.036A.75.75 0 0 1 18 1.5ZM16.5 15a.75.75 0 0 1 .712.513l.394 1.183c.15.447.5.799.948.948l1.183.395a.75.75 0 0 1 0 1.422l-1.183.395c-.447.15-.799.5-.948.948l-.395 1.183a.75.75 0 0 1-1.422 0l-.395-1.183a1.5 1.5 0 0 0-.948-.948l-1.183-.395a.75.75 0 0 1 0-1.422l1.183-.395c.447-.15.799-.5.948-.948l.395-1.183A.75.75 0 0 1 16.5 15Z" clip-rule="evenodd"></path>
               </svg>
               Analyze
            </button>
         </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
         <div>
            <label for="primaryColor" class="block text-sm font-medium text-gray-700">Primary Color</label>
            <div class="relative mt-1"><input id="primaryColor" class="w-full pl-12 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-brand-primary" type="text" value="#E11D48"><input class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 p-0 border-none rounded-md cursor-pointer" type="color" value="#E11D48"></div>
         </div>
         <div>
            <label for="font" class="block text-sm font-medium text-gray-700">Brand Font</label>
            <select id="font" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm rounded-md">
               <option value="Poppins">Poppins</option>
               <option value="Montserrat">Montserrat</option>
               <option value="Playfair Display">Playfair Display</option>
               <option value="Lato">Lato</option>
               <option value="Roboto">Roboto</option>
            </select>
         </div>
      </div>
      <div><button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-primary hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary">Save Brand &amp; Continue</button></div>
   </form>
</div>
</html>
