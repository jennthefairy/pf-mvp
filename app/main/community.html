
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://rsms.me/inter/inter.css');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white">

    <div class="max-w-lg w-full mx-4 text-center">
    
        <!-- Profile & Header -->
        <img 
            id="community-creator-pfp"
            src="/api/placeholder/128/128" 
            alt="Creator Profile Picture" 
            class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-gray-700 shadow-lg"
        >
        
        <h1 id="community-headline" class="text-3xl md:text-4xl font-bold">
            <!-- Editable by user -->
            You're Invited!
        </h1>
        
        <p id="community-subheadline" class="text-gray-300 mt-2 mb-8">
            <!-- Editable by user -->
            Join the exclusive Telegram community for my closest fans and get behind-the-scenes content.
        </p>

        <!-- Call to Action Button -->
        <a 
            id="community-link"
            href="https://t.me/your-telegram-channel" 
            target="_blank" 
            rel="noopener noreferrer"
            class="w-full bg-blue-500 text-white font-bold py-4 px-5 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-blue-500 transition duration-150 ease-in-out inline-flex items-center justify-center text-lg"
        >
            <!-- SVG Icon for Telegram -->
            <svg class="w-6 h-6 mr-3" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.88l-1.44 6.84c-.15.7-.68 1.02-1.33.64l-2.16-1.59-1.04 1c-.1.1-.2.2-.36.2-.15 0-.3-.07-.42-.2-.2-.2-.28-.4-.2-.68l.6-2.2 4.14-3.7c.18-.14-.04-.33-.27-.2l-5.1 3.2-2.13-.67c-.7-.22-.7-1.04.14-1.32l8.6-3.3c.7-.28 1.3.2 1.1 1z"></path>
            </svg>
            Join Telegram Channel
        </a>

        <!-- Footer -->
        <footer class="text-center mt-12">
            <p class="text-sm text-gray-500">
                Powered by <a href="#" class="font-semibold text-gray-400 hover:underline">[Your Platform Name]</a>
            </p>
        </footer>
    </div>
</body>
</html>
