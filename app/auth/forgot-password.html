
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PageFairy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <style>@import url('https://rsms.me/inter/inter.css'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100">

    <main class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <a href="/" class="text-3xl font-bold text-slate-900">PageFairy</a>
            </div>

            <div class="card bg-white shadow-lg border border-slate-200">
                <div class="card-body p-8">
                    <h1 class="card-title text-2xl mb-2">Forgot your password?</h1>
                    <p class="text-slate-500 mb-6">No problem. Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
                    
                    <form id="forgot-form" class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Email Address</span></label>
                            <input id="email" type="email" placeholder="jane@luxelashes.com" class="input input-bordered input-lg w-full" required />
                        </div>
                        
                        <div class="form-control pt-2">
                            <button type="submit" class="btn btn-primary btn-lg bg-indigo-600 hover:bg-indigo-700 text-white">Send Reset Link</button>
                        </div>
                    </form>

                    <div class="divider text-sm text-slate-400 my-6">or</div>

                                        <a href="login.html" class="btn btn-ghost w-full">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                        Back to Login
                    </a>
                </div>
            </div>
        </div>
    </main>
        <script>
            lucide.createIcons();
            const pb = new PocketBase(window.PB_URL);
            document.getElementById('forgot-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                try {
                    const workerUrl = (window.API_BASE || '').replace(/\/$/, '');
                    const endpoint = workerUrl ? `${workerUrl}/api/auth/request-password-reset` : `${window.PB_URL}/api/collections/users/request-password-reset`;
                    const res = await fetch(endpoint, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ email }) });
                    if (!res.ok) throw new Error(await res.text());
                    alert('If an account exists, a reset link was sent.');
                } catch (err) {
                    alert('Request failed: ' + (err?.message || err));
                }
            });
        </script>
</body>
</html>
