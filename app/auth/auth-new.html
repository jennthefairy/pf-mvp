<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PageFairy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Playfair Display', serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { fairy: { 50: '#fdfbff', 100: '#f5f3ff', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } } }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen flex">

    <!-- Left: Branding Area -->
    <div class="hidden lg:flex w-1/2 bg-fairy-50 items-center justify-center relative overflow-hidden border-r border-fairy-100">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1596704017254-9b121068fb31?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80')] bg-cover bg-center opacity-10"></div>
        <div class="relative z-10 max-w-md text-center px-10">
            <div class="inline-flex bg-white p-3 rounded-2xl shadow-sm mb-8">
                <i data-lucide="wand-2" class="w-8 h-8 text-fairy-600"></i>
            </div>
            <h1 class="text-4xl font-bold brand-font text-gray-900 mb-4">Launch your lash brand in minutes.</h1>
            <p class="text-gray-500 text-lg leading-relaxed">Join 2,000+ lash artists using PageFairy to test ideas and sell products with zero inventory risk.</p>
        </div>
    </div>

    <!-- Right: Form Area -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center lg:text-left">
                <h2 class="text-3xl font-bold text-gray-900 brand-font">Welcome back</h2>
                <p class="mt-2 text-sm text-gray-500">Please enter your details to sign in.</p>
            </div>

            <form class="space-y-6" action="home.html">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email address</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="h-5 w-5 text-gray-400"></i>
                        </div>
                        <input type="email" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-fairy-500 focus:border-fairy-500 sm:text-sm" placeholder="sarah@example.com" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                        </div>
                        <input type="password" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-fairy-500 focus:border-fairy-500 sm:text-sm" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" class="h-4 w-4 text-fairy-600 focus:ring-fairy-500 border-gray-300 rounded">
                        <label class="ml-2 block text-sm text-gray-900">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-fairy-600 hover:text-fairy-500">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-fairy-600 hover:bg-fairy-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-fairy-500 transition-colors">
                    Sign in
                </button>

                <button type="button" class="w-full flex justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none transition-colors gap-2">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    Sign in with Google
                </button>
            </form>

            <p class="text-center text-sm text-gray-500">
                Don't have an account? 
                <a href="onboarding.html" class="font-medium text-fairy-600 hover:text-fairy-500">Start free trial</a>
            </p>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
