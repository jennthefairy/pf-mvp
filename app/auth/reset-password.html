
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - PageFairy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <style>@import url('https://rsms.me/inter/inter.css'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100">

    <main class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md">
             <div class="text-center mb-8">
                <a href="/" class="text-3xl font-bold text-slate-900">PageFairy</a>
            </div>

            <div class="card bg-white shadow-lg border border-slate-200">
                <div class="card-body p-8">
                    <h1 class="card-title text-2xl mb-4">Create a new password</h1>
                    <p class="text-slate-500 mb-6">Choose a strong, new password for your account. This will replace your old password.</p>
                    
                                        <form id="reset-form" class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">New Password</span></label>
                                                        <input id="password" type="password" placeholder="••••••••" class="input input-bordered input-lg w-full" required />
                        </div>
                         <div class="form-control">
                            <label class="label"><span class="label-text">Confirm New Password</span></label>
                                                        <input id="confirm" type="password" placeholder="••••••••" class="input input-bordered input-lg w-full" required />
                        </div>
                        
                        <div class="form-control pt-2">
                            <button type="submit" class="btn btn-primary btn-lg bg-indigo-600 hover:bg-indigo-700 text-white">Save New Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
        <script>
            lucide.createIcons();
            const pb = new PocketBase(window.PB_URL);
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || params.get('tokenHash') || '';
            const email = params.get('email') || '';
            document.getElementById('reset-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirm').value;
                if (password !== confirm) { alert('Passwords do not match.'); return; }
                try {
                    const workerUrl = (window.API_BASE || '').replace(/\/$/, '');
                    const endpoint = workerUrl ? `${workerUrl}/api/auth/confirm-password-reset` : `${window.PB_URL}/api/collections/users/confirm-password-reset`;
                    const res = await fetch(endpoint, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ token, password, passwordConfirm: confirm }) });
                    if (!res.ok) throw new Error(await res.text());
                    alert('Password updated. Please log in.');
                    window.location.href = 'login.html';
                } catch (err) {
                    alert('Reset failed: ' + (err?.message || err));
                }
            });
        </script>
</body>
</html>
