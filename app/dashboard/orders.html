<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - PageFairy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Playfair Display', serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { fairy: { 50: '#fdfbff', 100: '#f5f3ff', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-slate-600 flex">

    <!-- SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 fixed h-full z-10">
        <div class="h-16 flex items-center px-6">
            <div class="flex items-center gap-2">
                <span class="bg-fairy-100 p-1.5 rounded-lg text-fairy-600"><i data-lucide="wand-2" class="h-5 w-5"></i></span>
                <span class="font-bold text-lg tracking-tight text-gray-900 brand-font">PageFairy</span>
            </div>
        </div>
        <nav class="flex-1 px-3 py-6 space-y-1">
            <a href="campaigns.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 rounded-md hover:bg-gray-50 hover:text-fairy-600 transition-colors">
                <i data-lucide="megaphone" class="h-4 w-4"></i><span>Campaigns</span>
            </a>
            <a href="orders.html" class="flex items-center gap-3 px-3 py-2 text-sm bg-fairy-50 text-fairy-700 rounded-md font-medium">
                <i data-lucide="package-check" class="h-4 w-4 text-fairy-600"></i><span>Orders</span>
            </a>
            <a href="subscribers.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 rounded-md hover:bg-gray-50 hover:text-fairy-600 transition-colors">
                <i data-lucide="users" class="h-4 w-4"></i><span>Subscribers</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-full bg-fairy-100 flex items-center justify-center text-fairy-700 font-bold text-xs">SL</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-gray-900 truncate">Sarah Lash Artist</p>
                    <p class="text-[10px] text-gray-400 truncate">Luxe Lashes Co.</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 md:ml-64 p-4 md:p-10 pt-20 md:pt-10 max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 brand-font">Orders</h1>
                <p class="text-sm text-gray-500 mt-1">Pre-orders captured from successful campaigns.</p>
            </div>
            <div class="flex gap-2">
                <button class="bg-white border border-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm font-medium">Filter</button>
                <button class="bg-fairy-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm">Process Batch</button>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden animate-fade-in">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-3 font-medium text-gray-500">Order ID</th>
                            <th class="px-6 py-3 font-medium text-gray-500">Customer</th>
                            <th class="px-6 py-3 font-medium text-gray-500">Items</th>
                            <th class="px-6 py-3 font-medium text-gray-500">Total</th>
                            <th class="px-6 py-3 font-medium text-gray-500">Status</th>
                            <th class="px-6 py-3 font-medium text-gray-500 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="orders-body">
                        <!-- JS Injected -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const orders = [
            { id: "#PF-2024", customer: "Monica Geller", item: "Rose Gold Tweezers (x2)", total: "$49.98", status: "Unfulfilled" },
            { id: "#PF-2023", customer: "Rachel Green", item: "Rose Gold Tweezers (x1)", total: "$24.99", status: "Unfulfilled" },
            { id: "#PF-2022", customer: "Phoebe Buffay", item: "Rose Gold Tweezers (x5)", total: "$124.95", status: "Processing" },
            { id: "#PF-2021", customer: "Chandler Bing", item: "Rose Gold Tweezers (x1)", total: "$24.99", status: "Fulfilled" },
        ];

        const tbody = document.getElementById('orders-body');
        
        tbody.innerHTML = orders.map(o => {
            let badgeClass = "bg-yellow-50 text-yellow-700"; // Unfulfilled
            if(o.status === "Fulfilled") badgeClass = "bg-green-50 text-green-700";
            if(o.status === "Processing") badgeClass = "bg-blue-50 text-blue-700";

            return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="px-6 py-4 font-mono text-xs text-gray-400">${o.id}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">${o.customer}</td>
                    <td class="px-6 py-4 text-gray-500">${o.item}</td>
                    <td class="px-6 py-4 font-medium text-gray-900">${o.total}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${badgeClass}">
                            ${o.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-gray-400 hover:text-fairy-600"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            `;
        }).join('');

        lucide.createIcons();
    </script>
</body>
</html>
