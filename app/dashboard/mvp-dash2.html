<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagefairy - Dashboard</title>
    
    <!-- CSS Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { primary: '#4F46E5', secondary: '#EEF2FF' } }, fontFamily: { sans: ['DM Sans', 'sans-serif'] } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full z-20 hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <div class="w-8 h-8 bg-brand-primary rounded-lg flex items-center justify-center text-white font-bold text-lg">P</div>
            <span class="ml-3 font-bold text-xl text-gray-800">Pagefairy</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="dashboard.html" class="flex items-center p-3 rounded-lg bg-brand-secondary text-brand-primary font-medium">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="ml-3">Dashboard</span>
            </a>
            <a href="campaigns.html" class="flex items-center p-3 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors">
                <i data-lucide="megaphone" class="w-5 h-5"></i>
                <span class="ml-3">Campaigns</span>
            </a>
            <a href="studio.html" class="flex items-center p-3 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
                <span class="ml-3">Fairy Studio</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
             <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-violet-500"></div>
                <div>
                    <p class="text-sm font-medium text-gray-700">JennTheFairy</p>
                    <p class="text-xs text-gray-400">Pro Plan</p>
                </div>
             </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-64 p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
            <a href="create_campaign.html" class="btn btn-primary text-white gap-2 shadow-lg shadow-brand-primary/30">
                <i data-lucide="plus" class="w-5 h-5"></i> New Campaign
            </a>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500">Total Pre-orders</h3>
                <p class="mt-2 text-3xl font-bold text-gray-900" id="totalPreorders">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:border-brand-primary transition-colors" onclick="window.location.href='campaigns.html'">
                <h3 class="text-sm font-medium text-gray-500">Active Campaigns</h3>
                <p class="mt-2 text-3xl font-bold text-brand-primary" id="activeCount">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500">Revenue (Est.)</h3>
                <p class="mt-2 text-3xl font-bold text-green-600" id="estRevenue">$0</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Campaign Performance</h2>
            <div class="w-full h-[300px]">
                <canvas id="performanceChart"></canvas>
            </div>
        </div>
        
        <!-- Recent Campaigns Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                 <h2 class="text-lg font-bold text-gray-800">Recent Campaigns</h2>
                 <a href="campaigns.html" class="text-sm text-brand-primary font-medium hover:underline">View all</a>
            </div>
            <div class="overflow-x-auto">
                <table class="table w-full">
                    <thead>
                        <tr class="text-gray-500 bg-gray-50/50">
                            <th>Campaign Name</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Goal</th>
                        </tr>
                    </thead>
                    <tbody id="recentTableBody">
                        <!-- JS Injected -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // --- Hardcoded Data ---
        const campaigns = [
            { id: 1, name: 'Velvet Lash Kit', status: 'Active', preorders: 85, goal: 100, price: 35 },
            { id: 2, name: 'Summer Glow', status: 'Successful', preorders: 250, goal: 200, price: 24 },
            { id: 3, name: 'Lash Foam', status: 'Failed', preorders: 12, goal: 50, price: 18 },
            { id: 4, name: 'Gold Tweezers', status: 'Active', preorders: 45, goal: 150, price: 22 }
        ];

        // --- Update Stats ---
        const totalPreorders = campaigns.reduce((sum, c) => sum + c.preorders, 0);
        const activeCount = campaigns.filter(c => c.status === 'Active').length;
        const revenue = campaigns.reduce((sum, c) => sum + (c.preorders * (c.price || 20)), 0);

        document.getElementById('totalPreorders').innerText = totalPreorders.toLocaleString();
        document.getElementById('activeCount').innerText = activeCount;
        document.getElementById('estRevenue').innerText = '$' + revenue.toLocaleString();

        // --- Render Chart ---
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: campaigns.map(c => c.name),
                datasets: [{
                    label: 'Pre-orders',
                    data: campaigns.map(c => c.preorders),
                    backgroundColor: '#4F46E5',
                    borderRadius: 4
                }, {
                    label: 'Goal',
                    data: campaigns.map(c => c.goal),
                    backgroundColor: '#E0E7FF',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: {
                    y: { beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false } }
                }
            }
        });
        
        // --- Render Table ---
        const tableBody = document.getElementById('recentTableBody');
        tableBody.innerHTML = campaigns.slice(0, 5).map(c => `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="font-medium text-gray-900">${c.name}</td>
                <td><span class="badge ${c.status === 'Active' ? 'badge-primary badge-outline' : c.status === 'Successful' ? 'badge-success badge-outline' : 'badge-ghost'}">${c.status}</span></td>
                <td>
                    <div class="flex items-center gap-2">
                        <progress class="progress progress-primary w-24" value="${c.preorders}" max="${c.goal}"></progress>
                        <span class="text-xs text-gray-500">${Math.round((c.preorders/c.goal)*100)}%</span>
                    </div>
                </td>
                <td class="text-gray-500">${c.goal} units</td>
            </tr>
        `).join('');

        lucide.createIcons();
    </script>
</body>
</html>
