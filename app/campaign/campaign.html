<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns - PageFairy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Playfair Display', serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-progress { animation: loadProgress 1s ease-out forwards; }
        @keyframes loadProgress { from { width: 0; } }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { fairy: { 50: '#fdfbff', 100: '#f5f3ff', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-slate-600 flex">

    <!-- SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 fixed h-full z-10">
        <div class="h-16 flex items-center px-6">
            <div class="flex items-center gap-2">
                <span class="bg-fairy-100 p-1.5 rounded-lg text-fairy-600"><i data-lucide="wand-2" class="h-5 w-5"></i></span>
                <span class="font-bold text-lg tracking-tight text-gray-900 brand-font">PageFairy</span>
            </div>
        </div>
        <nav class="flex-1 px-3 py-6 space-y-1">
            <a href="campaigns.html" class="flex items-center gap-3 px-3 py-2 text-sm bg-fairy-50 text-fairy-700 rounded-md font-medium">
                <i data-lucide="megaphone" class="h-4 w-4 text-fairy-600"></i><span>Campaigns</span>
            </a>
            <a href="orders.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 rounded-md hover:bg-gray-50 hover:text-fairy-600 transition-colors">
                <i data-lucide="package-check" class="h-4 w-4"></i><span>Orders</span>
            </a>
            <a href="subscribers.html" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600 rounded-md hover:bg-gray-50 hover:text-fairy-600 transition-colors">
                <i data-lucide="users" class="h-4 w-4"></i><span>Subscribers</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-full bg-fairy-100 flex items-center justify-center text-fairy-700 font-bold text-xs">SL</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-gray-900 truncate">Sarah Lash Artist</p>
                    <p class="text-[10px] text-gray-400 truncate">Luxe Lashes Co.</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 md:ml-64 p-4 md:p-10 pt-20 md:pt-10 max-w-6xl mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div><h1 class="text-2xl font-bold text-gray-900 brand-font">Campaigns</h1></div>
            <button class="flex items-center gap-2 bg-fairy-600 hover:bg-fairy-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> New Test
            </button>
        </div>

        <!-- Filters -->
        <div class="mb-8 border-b border-gray-200">
            <nav class="flex space-x-8" id="filter-container"></nav>
        </div>

        <!-- Grid -->
        <div id="campaign-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <script>
        // MOCK DATA
        const mockCampaigns = [
            { id: 1, title: "Velvet Noir Volume Trays", variant: "0.05 D Curl • Mix Length", status: "Active", preordered: 12, goal: 20, daysLeft: 4, price: 18.00, cost: 6.50 },
            { id: 2, title: "Rose Gold Isolation Tweezers", variant: "Diamond Grip • 45 Degree", status: "Successful", preordered: 45, goal: 15, daysLeft: 0, price: 24.99, cost: 8.00 },
            { id: 3, title: "Sensitive Lash Bath Foam", variant: "60ml • Oil Free", status: "Active", preordered: 8, goal: 50, daysLeft: 6, price: 15.00, cost: 4.50 },
            { id: 4, title: "Hydro-Gel Eye Pads", variant: "50 Pack • Lint Free", status: "Failed", preordered: 2, goal: 25, daysLeft: 0, price: 22.00, cost: 7.00 }
        ];

        const els = { grid: document.getElementById('campaign-grid'), filterContainer: document.getElementById('filter-container') };
        let currentStatus = null;

        const filters = [
            { name: 'All', status: null },
            { name: 'Active', status: 'Active' },
            { name: 'Validated', status: 'Successful' },
            { name: 'Ended', status: 'Failed' }
        ];

        function renderTabs() {
            els.filterContainer.innerHTML = filters.map(f => {
                const isActive = currentStatus === f.status;
                const activeClass = "border-fairy-600 text-fairy-600";
                const inactiveClass = "border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300";
                return `<button onclick="setFilter('${f.status || ''}')" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm transition-colors ${isActive ? activeClass : inactiveClass}">${f.name}</button>`;
            }).join('');
        }

        function createCard(c, i) {
            const percent = Math.min(100, Math.round((c.preordered / c.goal) * 100));
            const profit = ((c.price - c.cost) * c.preordered).toFixed(2);
            
            let statusConfig = {
                'Active': { color: 'fairy', label: 'Live', border: 'border-l-fairy-500', bg: 'bg-fairy-500' },
                'Successful': { color: 'emerald', label: 'Validated', border: 'border-l-emerald-500', bg: 'bg-emerald-500' },
                'Failed': { color: 'gray', label: 'Ended', border: 'border-l-gray-300', bg: 'bg-gray-300' }
            }[c.status];

            return `
                <div class="bg-white rounded-lg border border-gray-200 border-l-4 ${statusConfig.border} p-5 hover:shadow-md transition-shadow animate-fade-in flex flex-col" style="animation-delay: ${i*50}ms">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-${statusConfig.color}-600 bg-${statusConfig.color}-50 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide">${statusConfig.label}</span>
                        <span class="text-xs text-gray-400 font-medium">${c.daysLeft > 0 ? c.daysLeft + ' days left' : 'Closed'}</span>
                    </div>
                    <div class="mb-5">
                        <h3 class="font-bold text-gray-900 text-lg leading-tight brand-font mb-0.5">${c.title}</h3>
                        <p class="text-xs text-gray-400">${c.variant}</p>
                    </div>
                    <div class="mb-5">
                        <div class="flex justify-between items-end mb-1.5">
                            <div class="text-xs font-medium text-gray-500"><span class="text-gray-900 font-bold text-base">${c.preordered}</span> / ${c.goal} units</div>
                            <span class="text-xs font-bold text-gray-900">${percent}%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden"><div class="${statusConfig.bg} h-1.5 rounded-full animate-progress" style="width: ${percent}%"></div></div>
                    </div>
                    <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
                        <div><p class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Profit</p><p class="text-sm font-medium text-gray-900">$${profit}</p></div>
                        <a href="#" class="p-2 rounded-full hover:bg-gray-50 text-gray-400 hover:text-fairy-600 transition-colors"><i data-lucide="arrow-right" class="w-4 h-4"></i></a>
                    </div>
                </div>
            `;
        }

        function render() {
            const filtered = mockCampaigns.filter(c => !currentStatus || c.status === currentStatus);
            els.grid.innerHTML = filtered.map((c, i) => createCard(c, i)).join('');
            lucide.createIcons();
        }

        window.setFilter = (status) => {
            currentStatus = status === '' ? null : status;
            renderTabs();
            render();
        };

        document.addEventListener('DOMContentLoaded', () => { renderTabs(); render(); });
    </script>
</body>
</html>
